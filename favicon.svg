<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Electric Blue to Cyan Turquoise -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Soft drop shadow for droplet -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#014f7a" flood-opacity="0.38" />
    </filter>

    <!-- Highlight blur -->
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <!-- Modern App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.22" />

  <!-- Pure Teardrop Water Droplet -->
  <g filter="url(#dropShadow)">
    <path d="M256,82 C274,165 371,225 371,310 A115,115 0 0,1 141,310 C141,225 238,165 256,82 Z" fill="#ffffff" />
  </g>

  <!-- Water Filtration Arc Swirl & Pure Core Dot -->
  <g>
    <path d="M285.7,305.3 A42,42 0 1,0 285.7,364.7" fill="none" stroke="#0284c7" stroke-width="16" stroke-linecap="round" />
    <circle cx="256" cy="335" r="14" fill="#0284c7" />
  </g>

  <!-- Glistening Light Reflection Sheen -->
  <path d="M225,180 C202,220 188,260 185,295" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.65" filter="url(#softBlur)" />
</svg>
